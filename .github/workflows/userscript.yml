name: Check Bangumi Scout

on:
  push:
    paths:
      - userscript/**
      - .github/workflows/userscript.yml
  pull_request:
    paths:
      - userscript/**
      - .github/workflows/userscript.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: userscript
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: userscript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        id: browser-tests
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userscript-playwright-report
          path: |
            userscript/playwright-report
            userscript/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Note non-blocking browser test result
        if: steps.browser-tests.outcome == 'failure'
        run: echo "::warning title=Playwright did not block the build::Userscript unit tests and build succeeded; inspect the uploaded Playwright report."
